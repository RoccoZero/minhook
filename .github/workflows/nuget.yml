name: Publish NuGet

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Pack
        shell: pwsh
        run: msbuild bindings\MinHook.NET\MinHook.NET.csproj /restore /t:Pack /p:Configuration=Release /p:PlatformToolset=v143 /p:PackageVersion=1.3.4.${{ github.run_number }} /p:PackageOutputPath=${{ github.workspace }}\artifacts\packages

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinHook.NET
          path: artifacts/packages/*.nupkg

      - name: Publish package
        shell: pwsh
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
